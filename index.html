
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stickman Jump Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Stickman Jump</h1>
    <div class="score-board">
      <span>Score: <b id="score">0</b></span>
      <span>Best: <b id="best">0</b></span>
    </div>

    <div class="game-area">
      <canvas id="gameCanvas" width="850" height="350"></canvas>

      <div class="game-overlay" id="overlay">
        <h2 id="message">Ready to Jump?</h2>
        <p>Press SPACE or tap to start</p>
        <button id="startBtn">Start Game</button>
      </div>
    </div>

    <p class="instructions">
      Press SPACE / ↑ or tap the screen to jump!
    </p>
    <button id="jumpBtn">JUMP</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
